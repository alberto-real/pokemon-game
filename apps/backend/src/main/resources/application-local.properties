spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.albertoreal.pokemongame=DEBUG

# Enable the real AI chain in local dev
pokemon-game.ai.provider=chain
pokemon-game.ai.groq.enabled=true
pokemon-game.ai.openrouter.enabled=true

# Bump Ollama token budget so the 3B model can finish the full 5-question JSON
spring.ai.ollama.chat.options.num-predict=2048
