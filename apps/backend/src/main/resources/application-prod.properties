# DB (host = nombre del servicio docker-compose)
spring.datasource.url=jdbc:postgresql://postgres:5432/pokemon_game
spring.datasource.username=pokemon

# AI chain — solo Groq + OpenRouter, sin Ollama
pokemon-game.ai.provider=chain
pokemon-game.ai.groq.enabled=true
pokemon-game.ai.openrouter.enabled=true
pokemon-game.ai.ollama.enabled=false

# Scheduler enabled in prod (daily quiz generation)
pokemon-game.scheduler.enabled=true

# Actuator minimo para healthchecks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Logs
logging.level.root=INFO
logging.level.com.albertoreal.pokemongame=INFO
